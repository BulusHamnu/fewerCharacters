<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shorten your text effortlessly with FewerCharacters.com. Enter your content, set your character limit, and get the perfect text to fit your needs. Try it now!"
    />
    <title>FewerCharacters: A Simple Tool to Shorten Your Texts</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="container"></div>

    <!-- React, Babel and ReactRouterDom import -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Componet and pages import -->
    <script type="text/babel" src="./src/components/header.jsx"></script>
    <script type="text/babel" src="./src/pages/about.jsx"></script>
    <script type="text/babel" src="./src/components/inputSection.jsx"></script>
    <script type="text/babel" src="./src/components/outputSection.jsx"></script>
    <script type="text/babel" src="./src/pages/home.jsx"></script>
    <script type="module" src="./src/services/shortenSentence.js"></script>

    <script type="text/babel">
      const { useState, useRef } = React;
      const { BrowserRouter, Route, Switch, Link } = ReactRouterDOM;

      // App entry point
      const App = () => {
        return (
          <BrowserRouter>
            <Switch>
              <Route path="/" exact component={HomePage}></Route>
              <Route path="/about" component={AboutPage}></Route>
            </Switch>
          </BrowserRouter>
        );
      };
      const container = document.querySelector(".container");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
